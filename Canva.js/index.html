
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercícios Canvas</title>
</head>
<body>

    <h2>Exercícios de Canvas</h2>

    <h3>1, 2 e 3 - Barra de progresso</h3>

    <canvas id="canvas" width="400" height="100"
        style="border: 2px solid black;">
    </canvas>

    <br><br>

    <input type="range" id="progresso"
        min="0" max="100" value="40">

    <span id="porcentagem">40%</span>

    <h3>4 - Bandeiras</h3>

    <canvas id="bandeiras" width="400" height="200"
        style="border: 2px solid black;">
    </canvas>

    <h3>5 - Casa</h3>

    <canvas id="casa" width="400" height="400"
        style="border: 2px solid black;">
    </canvas>

    <script src="script.js"></script>

</body>
</html>
