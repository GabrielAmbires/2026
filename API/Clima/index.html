<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#102c51">
    <title>Clima Agora</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="weather-app">
        <header class="topbar">
            <a class="brand" href="#" aria-label="Clima Agora, início">
                <span class="brand-mark" aria-hidden="true">☼</span>
                <span>clima<span class="brand-light">agora</span></span>
            </a>
            <span class="live-label"><span class="live-dot"></span> Previsão ao vivo</span>
        </header>

        <section class="search-section" aria-labelledby="page-title">
            <p class="eyebrow">O TEMPO, ONDE VOCÊ ESTIVER</p>
            <h1 id="page-title">Como está o céu?</h1>
            <form class="search-form" id="search-form">
                <label class="visually-hidden" for="input">Buscar cidade</label>
                <span class="search-icon" aria-hidden="true">⌕</span>
                <input type="search" id="input" placeholder="Digite uma cidade..." autocomplete="off" required>
                <button id="botao" type="submit"><span aria-hidden="true">⌕</span> Buscar</button>
            </form>
        </section>

        <p id="status" class="status-message" role="status" aria-live="polite">Busque uma cidade para ver a previsão.</p>

        <section id="weather-panel" class="weather-panel" aria-label="Previsão do tempo" hidden>
            <div class="current-weather">
                <div class="current-copy">
                    <p class="eyebrow current-eyebrow">AGORA</p>
                    <h2 id="city-name" class="city-name"></h2>
                    <p id="current-date" class="current-date"></p>
                    <p id="condition" class="condition"></p>
                    <div class="temperature-line">
                        <span id="temperature" class="temperature"></span>
                        <span id="weather-icon" class="current-icon" aria-hidden="true"></span>
                    </div>
                    <p id="feels-like" class="feels-like"></p>
                </div>
                <div class="weather-details" aria-label="Detalhes do clima">
                    <div class="detail-item"><span class="detail-symbol" aria-hidden="true">◌</span><div><span class="detail-label">Umidade</span><strong id="humidity"></strong></div></div>
                    <div class="detail-item"><span class="detail-symbol" aria-hidden="true">↗</span><div><span class="detail-label">Vento</span><strong id="wind"></strong></div></div>
                    <div class="detail-item"><span class="detail-symbol" aria-hidden="true">◷</span><div><span class="detail-label">Condição</span><strong id="current-condition"></strong></div></div>
                </div>
            </div>

            <section class="forecast-section" aria-labelledby="forecast-title">
                <div class="forecast-heading">
                    <div><p class="eyebrow">PRÓXIMOS DIAS</p><h2 id="forecast-title">Previsão da semana</h2></div>
                    <span class="forecast-unit">Temperaturas em °C</span>
                </div>
                <div id="forecast" class="forecast-grid"></div>
            </section>
            <footer class="source-note">Dados meteorológicos por Open-Meteo</footer>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
