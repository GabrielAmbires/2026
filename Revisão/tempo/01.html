<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contagem Olímpica</title>
    <link rel="stylesheet" href="01.css">
</head>

<body>

    <main class="pagina">
        <section class="hero" aria-labelledby="titulo">
            <div class="marca">
                <span class="anel azul"></span>
                <span class="anel amarelo"></span>
                <span class="anel preto"></span>
                <span class="anel verde"></span>
                <span class="anel vermelho"></span>
            </div>
            <p class="etiqueta">Los Angeles 2028</p>
            <h1 id="titulo">A contagem para os Jogos começou</h1>
            <p class="subtitulo">Faltam exatamente...</p>
        </section>

        <section class="painel" aria-label="Tempo restante para as Olimpíadas">
            <div id="olimpiadas" class="contagem">
                <div class="tempo"><strong>00</strong><span>dias</span></div>
                <div class="tempo"><strong>00</strong><span>horas</span></div>
                <div class="tempo"><strong>00</strong><span>minutos</span></div>
                <div class="tempo"><strong>00</strong><span>segundos</span></div>
            </div>
        </section>

    </main>

    <script src="01.js"></script>
</body>

</html>
